# Fail2Ban action: pre-ban IP reputation check via local IP Radar instance
#
# What it does: BEFORE fail2ban bans an IP, ask a local IP Radar instance
# for a fused multi-source verdict on that IP, then route the ban accordingly:
#
#   - malicious (confidence >= threshold)  -> ban AND append to a persistent
#                                             long-ban list (extended jail time)
#   - CDN / known-service edge             -> skip the ban, log for manual review
#   - otherwise (benign / no evidence)     -> normal short ban (default behavior)
#
# Why: a single cloud API (e.g. AbuseIPDB) means rate limits and one vendor's
# bias. IP Radar fuses 29 public feeds locally (blocklists, Tor/VPN/proxy,
# GeoIP/ASN, CDN edges) — the check is a localhost HTTP call: no rate limit,
# no per-query data leaving the machine.
#
# Requires:
#   - IP Radar running locally: https://github.com/steponeerror/ip-radar
#     (docker compose up -d --build, then http://127.0.0.1:8000)
#   - curl, python3 (both present on any typical fail2ban host)
#
# Install:
#   cp ipradar.conf /etc/fail2ban/action.d/
#   # then in jail.conf(5) style, e.g. in jail.local [sshd]:
#   #   action = %(known/action)s
#   #            ipradar
#
# Tunables (override in the jail action call):
#   ipradar[url]         IP Radar base URL          (default http://127.0.0.1:8000)
#   ipradar[threshold]   malicious confidence gate  (default 70, range 0-100)
#   ipradar[bantime]     extended ban time for confirmed malicious IPs
#   ipradar[longlist]    persistent file of confirmed-malicious IPs
#
# Example, stricter:
#   action = ipradar[threshold=80, bantime=1w]

[Definition]

# Skip this action for restored tickets (old bans replayed at startup).
norestored = 1

# Prepare the persistent list directory at first ban (longlist lives outside
# fail2ban's own state dir, so nothing creates it for us).
actionstart = mkdir -p $(dirname <ipradar_longlist>)

actionstop =

actioncheck =

# Pre-ban triage. Exit code 100 tells fail2ban "do not ban this IP at all";
# any other non-zero aborts the action chain. We deliberately never fail the
# chain on IP Radar being down — a dead intel sidecar must not disable banning.
actionban = curlexit=$(curl -sS -m <ipradar_timeout> -o /dev/null -w '%{exitcode}' <ipradar_url>/api/lookup/<ip> 2>/dev/null); \
            if [ "$curlexit" != "0" ]; then \
                echo "ipradar: lookup unavailable (curl exit $curlexit), falling back to default ban" >&2; \
                exit 0; \
            fi; \
            verdict=$(curl -sS -m <ipradar_timeout> <ipradar_url>/api/lookup/<ip> | python3 -c 'import json,sys; \
d=json.load(sys.stdin); \
cls=d.get("classifications",{}); \
worst=max((c.get("confidence",0) for c in cls.values() if c.get("verdict")=="malicious"), default=0); \
attrs=d.get("attributes",{}); \
svc=[a.get("native_type") or a.get("value") for a in attrs.get("service",[])]; \
is_cdn=any(v in ("cdn","CDN") or (isinstance(v,str) and "cdn" in v.lower()) for a in attrs.get("is_cdn",[]) for v in [a.get("value")]); \
print(("CDN" if is_cdn or svc else "MAL" if worst >= int(sys.argv[1]) else "OK"), worst)' <ipradar_threshold>); \
            case "$verdict" in \
                CDN) echo "ipradar: <ip> is a CDN/service edge (SKIPPING ban — verify manually if unexpected)" >&2; exit 100 ;; \
                MAL) echo "ipradar: <ip> confirmed malicious -> recorded in <ipradar_longlist>" >&2; echo "<ip>" >> <ipradar_longlist>; date -u +%%s >> <ipradar_longlist> ; exit 0 ;; \
            esac; \
            echo "ipradar: <ip> not confirmed malicious (worst=$verdict), default ban proceeds" >&2; \
            exit 0

# MAL branch note: fail2ban applies its own ban; this action only *records* the
# confirmed-malicious IP to <ipradar_longlist> so admins can feed a firewall
# drop list (e.g. ipset) with long expiry. Keeping enforcement in fail2ban's
# hands was deliberate — this action is intel triage, not a second firewall.

actionunban =

[Init]

# IP Radar base URL. Keep it localhost — that's the whole point (no external calls).
ipradar_url = http://127.0.0.1:8000

# Confidence gate: only treat as confirmed-malicious when the worst malicious
# classification is at/above this. 70 = high bar, few false positives.
ipradar_threshold = 70

# Lookup timeout (seconds). On timeout the action no-ops and banning proceeds.
ipradar_timeout = 3

# Persistent list of confirmed-malicious IPs (one per line, paired with epoch
# timestamp on the following line — kept in ban order for easy pruning).
ipradar_longlist = /var/lib/fail2ban/ipradar/confirmed.txt
