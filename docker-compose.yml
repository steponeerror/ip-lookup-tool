services:
  ipradar:
    build: .
    image: ipradar:latest
    ports:
      - "127.0.0.1:${IPRADAR_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    volumes:
      - ipradar-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/db-status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # HTTP 现秒级可达(warming 期 db-status 返 200);60s 留慢机余量
volumes:
  ipradar-data:
