<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="15" fill="#0f0a1a" opacity="0.7"/>

  <!-- Radar rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#ring)" stroke-width="0.5" opacity="0.4"/>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="url(#ring)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="url(#ring)" stroke-width="0.5" opacity="0.6"/>

  <!-- Globe latitude lines -->
  <ellipse cx="16" cy="16" rx="11" ry="4" fill="none" stroke="url(#ring)" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="16" cy="12" rx="8.5" ry="3" fill="none" stroke="url(#ring)" stroke-width="0.4" opacity="0.3"/>
  <ellipse cx="16" cy="20" rx="8.5" ry="3" fill="none" stroke="url(#ring)" stroke-width="0.4" opacity="0.3"/>

  <!-- Globe longitude line (vertical) -->
  <ellipse cx="16" cy="16" rx="4" ry="11" fill="none" stroke="url(#ring)" stroke-width="0.5" opacity="0.4"/>

  <!-- Crosshair lines -->
  <line x1="16" y1="2" x2="16" y2="7" stroke="#22d3ee" stroke-width="0.8" opacity="0.7"/>
  <line x1="16" y1="25" x2="16" y2="30" stroke="#22d3ee" stroke-width="0.8" opacity="0.7"/>
  <line x1="2" y1="16" x2="7" y2="16" stroke="#22d3ee" stroke-width="0.8" opacity="0.7"/>
  <line x1="25" y1="16" x2="30" y2="16" stroke="#22d3ee" stroke-width="0.8" opacity="0.7"/>

  <!-- Location pin -->
  <path d="M16 8c-3.3 0-6 2.5-6 5.5 0 4.1 6 10.5 6 10.5s6-6.4 6-10.5c0-3-2.7-5.5-6-5.5z" fill="none" stroke="url(#glow)" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="16" cy="13.5" r="2.5" fill="url(#glow)"/>

  <!-- Scan pulse arc -->
  <path d="M5.5 7.5A14 14 0 0 1 24.5 5" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M8 5A11 11 0 0 1 25.5 9" fill="none" stroke="#a78bfa" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Corner brackets (tech frame) -->
  <path d="M3 8 L3 3 L8 3" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M29 8 L29 3 L24 3" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M3 24 L3 29 L8 29" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M29 24 L29 29 L24 29" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>
